[package]
name = "ntcomp"
version = "0.1.0"
edition = "2024"
authors = [
    "Tommi Mäklin <tommi@maklin.fi>",
]
description = "Sequencing data compression using SBWT and k-bounded matching statistics."
readme = "README.md"
## homepage = "https://github.com/tmaklin/ntcomp"
repository = "https://codeberg.org/themaklin/ntcomp"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ntcomp"
path = "src/main.rs"

[features]
default = []
graph-view = ["dep:egui", "dep:eframe", "dep:egui_graphs"]

[dependencies]
## core
bincode = { version = "2", features = ["serde"] }
bitnuc = "0.2"
dsi-bitstream = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
kbo = { path = "vendor/kbo", version = "0.5.2" }
sbwt = "=0.6.2"

## collection
indexmap = "2.14"

## parallelism
rayon = "1.12"

## graph
blake3 = {version = "1.8", features = ["serde"] }
petgraph = { version = "0.8", features = ["serde-1"] }
postcard = { version = "1.1", features = ["alloc", "use-std"] }
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "encoder", "optimization"] }
serde = "1"
stacker = "0.1"

## graphview
egui = { version = "0.36", optional = true }
eframe = { version = "0.36", optional = true }
egui_graphs = { version = "0.32", optional = true }

## cli
clap = { version = "4", features = ["derive"]}
csv = "1"
indicatif = "0.18"
log = "0.4"
needletail = { version = "0.6", default-features = false, features = ["flate2"] }
stderrlog = "0.6"

[dev-dependencies]
random = "0.14"

[profile.release]
debug = true
strip = false
## lto = true
## codegen-units = 1
