[package]
name = "ntcomp"
version = "0.1.0"
edition = "2024"
authors = [
    "Tommi Mäklin <tommi@maklin.fi>",
]
description = "Sequencing data compression using SBWT and k-bounded matching statistics."
readme = "README.md"
## homepage = "https://github.com/tmaklin/ntcomp"
repository = "https://codeberg.org/themaklin/ntcomp"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ntcomp"
path = "src/main.rs"

[dependencies]
## core
bincode = { version = "2", features = ["serde"] }
bitnuc = "0.2"
csv = "1"
dsi-bitstream = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
kbo = "0.5.2"
log = "0.4"
needletail = { version = "0.6", default-features = false, features = ["flate2"] }
sbwt = "=0.6.2"
stderrlog = "0.6"

## collection
indexmap = "2.14"

## graph
blake3 = {version = "1.8", features = ["serde"] }
petgraph = { version = "0.8", features = ["serde-1"] }
postcard = { version = "1.1", features = ["alloc", "use-std"] }
serde = "1"
stacker = "0.1"

## cli
clap = { version = "4", features = ["derive"]}
indicatif = "0.18"

[dev-dependencies]
random = "0.14"

[profile.release]
debug = true
